[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mini-toolatlas"
version = "0.1.0"
description = "A minimal, local implementation of ToolAtlas tool-side memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]
nim = ["openai>=1.0"]

[project.scripts]
toolatlas-demo = "toolatlas.demo:main"
toolatlas-memory-server = "toolatlas.memory_server:main"
toolatlas-text-server = "toolatlas.text_tools_server:main"
toolatlas-filesystem-demo = "toolatlas.filesystem_demo:main"
toolatlas-readonly-ab = "toolatlas.readonly_benchmark:main"
toolatlas-nim-ab = "toolatlas.llm_ab_nim:main"
toolatlas-everything-demo = "toolatlas.everything_demo:main"
toolatlas-everything-nim-ab = "toolatlas.llm_ab_everything:main"
toolatlas-github-demo = "toolatlas.github_demo:main"
toolatlas-github-nim-ab = "toolatlas.llm_ab_github:main"
toolatlas-mcpmark-fp-ab = "toolatlas.mcpmark_file_property_ab:main"
toolatlas-mcpmark-pg-ab = "toolatlas.mcpmark_postgres_ab:main"
toolatlas-paper-benchmark = "toolatlas.paper_benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toolatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
